# Pull to refresh, on the PullToRefresh example.
#
#   maestro test -e APP_ID=com.microsoft.reacttestapp e2e/pull-to-refresh.yaml   (Android)
#   maestro test -e APP_ID=com.microsoft.ReactTestApp e2e/pull-to-refresh.yaml   (iOS)
#
# The example shows three counters next to the WebView, which is what the assertions read:
# "Refreshes" counts the calls to onRefresh, "Loads" the page loads. Changing the mode keeps
# the WebView mounted, changing the page mounts a new one.
appId: ${APP_ID}
---
- launchApp
# An Android emulator that has just booted can take minutes to show the app. On iOS the test
# app pushes the example screen after launch, which moves every element: wait for it to
# settle, the tap would land on a stale position otherwise.
- extendedWaitUntil:
    visible:
      id: testType_pullToRefresh
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: testType_pullToRefresh
# Leaves most of the screen to the WebView, the swipes below need the room.
- tapOn:
    id: toggle_tests_button
- extendedWaitUntil:
    visible: 'Loads: 1'
    timeout: 60000

# Controlled (the refresh control has an onRefresh): a pull at the top of the page calls
# onRefresh once, the app keeps the indicator for a moment, and the page is not reloaded.
- swipe:
    start: 50%, 45%
    end: 50%, 85%
    duration: 700
- assertVisible: 'Refreshes: 1'
- extendedWaitUntil:
    visible: Idle
    timeout: 10000
- assertVisible: 'Loads: 1'

# Automatic (no onRefresh): a pull reloads the page, and nothing is asked of the app.
- tapOn:
    id: pullToRefresh_mode
- assertVisible: 'Mode: auto'
- swipe:
    start: 50%, 45%
    end: 50%, 85%
    duration: 700
- extendedWaitUntil:
    visible: 'Loads: 2'
    timeout: 30000
- assertVisible: 'Refreshes: 0'

# Without a refresh control, a pull does nothing.
- tapOn:
    id: pullToRefresh_mode
- assertVisible: 'Mode: off'
- swipe:
    start: 50%, 45%
    end: 50%, 85%
    duration: 700
- waitForAnimationToEnd
- assertVisible: 'Loads: 2'
- assertVisible: 'Refreshes: 0'

# Away from the top, pulling down scrolls the page and does not refresh.
- tapOn:
    id: pullToRefresh_mode
- assertVisible: 'Mode: controlled'
- swipe:
    start: 50%, 85%
    end: 50%, 45%
    duration: 300
- swipe:
    start: 50%, 85%
    end: 50%, 45%
    duration: 300
- swipe:
    start: 50%, 50%
    end: 50%, 65%
    duration: 1000
- waitForAnimationToEnd
- assertVisible: 'Refreshes: 0'
- assertVisible: Idle

# A page that scrolls inside an element: the WebView itself never scrolls, so its scroll
# position says nothing. The WebView is mounted without a refresh control, which is added
# afterwards.
- tapOn:
    id: pullToRefresh_mode
- tapOn:
    id: pullToRefresh_mode
- assertVisible: 'Mode: off'
- tapOn:
    id: pullToRefresh_page
- assertVisible: 'Page: inner'
- extendedWaitUntil:
    visible: 'Loads: 1'
    timeout: 30000
- tapOn:
    id: pullToRefresh_mode
- assertVisible: 'Mode: controlled'

# With the element at its top, a pull refreshes. Not on iOS: there the element is a scroll
# view of its own, which takes the pull, like in Safari.
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 85%
          duration: 700
      - assertVisible: 'Refreshes: 1'
      - extendedWaitUntil:
          visible: Idle
          timeout: 10000

# With the element scrolled down, a pull scrolls it back and does not refresh.
- swipe:
    start: 50%, 85%
    end: 50%, 45%
    duration: 300
- swipe:
    start: 50%, 85%
    end: 50%, 45%
    duration: 300
- swipe:
    start: 50%, 50%
    end: 50%, 65%
    duration: 1000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: 'Refreshes: 1'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: 'Refreshes: 0'
- assertVisible: Idle
