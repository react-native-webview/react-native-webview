name: Android
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash
      - name: Bundle example JavaScript
        run: bun run bundle:android
        working-directory: packages/example-mobile
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build Android test app
        run: ./gradlew --no-daemon clean build check test
        shell: bash
        working-directory: packages/example-mobile/android
    timeout-minutes: 60
