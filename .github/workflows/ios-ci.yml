name: iOS
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Bundle example JavaScript
        run: bun run bundle:ios
        working-directory: packages/example-mobile
      - name: Install Pods
        run: pod install
        working-directory: packages/example-mobile/ios
      - name: Build iOS test app
        run: |
          device_name='iPhone 17'
          device=$(xcrun simctl list devices "${device_name}" available | grep "${device_name} (")
          re='\(([-0-9A-Fa-f]+)\)'
          [[ $device =~ $re ]] || exit 1
          echo "SIMULATOR_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          xcodebuild -workspace WebviewExample.xcworkspace -scheme ReactTestApp -destination "platform=iOS Simulator,id=${BASH_REMATCH[1]}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
        working-directory: packages/example-mobile/ios
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run end-to-end tests
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" ios/build/Build/Products/Debug-iphonesimulator/ReactTestApp.app
          maestro --device "$SIMULATOR_ID" test -e APP_ID=com.microsoft.ReactTestApp e2e
        working-directory: packages/example-mobile
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      - name: Upload Maestro report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: ~/.maestro/tests
    timeout-minutes: 60
