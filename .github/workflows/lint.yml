name: 'Lint'
on: [pull_request]

jobs:
  lint:
    name: 'Running lint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Setup - Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint:ci
      - name: Run unit tests
        run: bun run test
      - name: Build package and declarations
        run: bun run prepare
